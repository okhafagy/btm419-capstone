{% extends 'dashboard/base.html' %}

{% block content %}
<div class="flex">
    <!-- Sidebar -->
    <div class="w-1/5 bg-gray-800 text-white p-6">
        <div class="flex flex-col">
            <h3 class="text-2xl font-semibold mb-8">Welcome, Jeff Marsh</h3>
            <ul>
                <li class="mb-4">
                    <a href="{% url 'dashboard:index' %}" class="text-lg hover:underline">Dashboard</a>
                </li>
                <li class="mb-4">
                    <a href="{% url 'dashboard:sales' %}" class="text-lg hover:underline">Sales</a>
                </li>
                <li class="mb-4">
                    <a href="{% url 'dashboard:inventory_log' %}" class="text-lg font-bold text-blue-400 hover:underline">Inventory</a>
                </li>
                <li class="mb-4">
                    <a href="{% url 'dashboard:claims' %}" class="text-lg hover:underline">Claims</a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="w-4/5 p-6 bg-gray-100 min-h-screen">
        <h1 class="text-3xl font-semibold text-blue-700 mb-6">Remove a Purchase</h1>

        <!-- Navigation Links -->
        <div class="mb-6 space-x-4">
            <a href="{% url 'dashboard:inventory_log' %}" class="text-blue-600 underline hover:text-blue-800">Purchase Order Inventory</a>
            <a href="{% url 'dashboard:inventory_sum' %}" class="text-blue-600 underline hover:text-blue-800">Current Inventory</a>
            <a href="{% url 'dashboard:add_purchase' %}" class="text-blue-600 underline hover:text-blue-800">New Purchase</a>
        </div>

        <!-- Remove Form -->
        <form method="post" class="bg-white p-6 rounded-lg shadow-md space-y-4 w-full max-w-md">
            {% csrf_token %}
            <div>
                <label for="purchase_id" class="block font-medium text-gray-700 mb-1">Select Purchase ID to Remove:</label>
                <select name="purchase_id" id="purchase_id" class="w-full border border-black px-3 py-2 rounded">
                    {% for purchase_id in purchase_ids %}
                    <option value="{{ purchase_id }}">{{ purchase_id }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="bg-red-600 hover:bg-red-800 text-white font-semibold py-2 px-4 rounded">
                Remove Purchase
            </button>
        </form>
    </div>
</div>
{% endblock %}
