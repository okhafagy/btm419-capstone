{% extends 'dashboard/base.html' %}

{% block title %}Add New Product{% endblock %}

{% block content %}
<div class="flex justify-center min-h-screen py-12 px-6 bg-gray-100">
    <!-- Product Form -->
    <div class="w-full md:w-1/2 p-8 bg-white rounded-lg shadow-md">
        <h1 class="text-3xl font-semibold mb-4 text-blue-700">Add New Product</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="product_name" class="block text-lg font-medium text-gray-700">Product Name</label>
                <input type="text" id="product_name" name="product_name" class="w-full p-3 border border-gray-300 rounded-md" placeholder="Enter Product Name" value="{{ form.product_name.value }}">
            </div>

            <div class="mb-4">
                <label for="price" class="block text-lg font-medium text-gray-700">Price ($)</label>
                
                <input type="number" id="price" name="price" step="0.1" class="w-full p-3 border border-gray-300 rounded-md" placeholder="Enter Price" value="{{ form.price.value }}">
            </div>

            <div class="mb-4">
                <label for="product_image" class="block text-lg font-medium text-gray-700">Product Image</label>
                <input type="file" id="product_image" name="product_image" class="w-full p-3 border border-gray-300 rounded-md">
            </div>

            <button type="submit" class="py-4 px-8 text-lg bg-blue-500 text-white rounded-xl hover:bg-blue-700 w-full">Add Product</button>
        </form>
    </div>
</div>
{% endblock %}
